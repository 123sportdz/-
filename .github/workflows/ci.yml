name: Elhadath Reels CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up FFmpeg and ffprobe
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6
        with:
          ffmpeg-version: 7.0.2

      - name: Verify FFmpeg and ffprobe
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders | grep -q libx264

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit and API tests
        run: python -m pytest -q --ignore=tests/test_dashboard_browser.py

      - name: Compile Python sources
        run: python -m compileall -q dashboard.py reel.py reelbot.py autopilot.py reelkit tests

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import subprocess
          import tempfile
          import dashboard

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', dashboard.HTML, re.S)
          assert scripts, 'dashboard JavaScript was not found'
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as handle:
              handle.write('\n'.join(scripts))
              path = handle.name
          try:
              result = subprocess.run(['node', '--check', path], text=True, capture_output=True)
              print(result.stderr)
              raise SystemExit(result.returncode)
          finally:
              Path(path).unlink(missing_ok=True)
          PY

  windows:
    name: Windows installer and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install FFmpeg and ffprobe
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $chocoBin = 'C:\ProgramData\chocolatey\bin'
          $env:PATH = "$chocoBin;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $chocoBin
          ffmpeg -version
          ffprobe -version

      - name: Run Windows installer
        shell: cmd
        run: install.bat --auto

      - name: Install test dependencies
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Run Python tests
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest -q --ignore=tests/test_dashboard_browser.py

      - name: Compile Python sources
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m compileall -q dashboard.py reel.py reelbot.py autopilot.py reelkit tests

  selftest:
    name: Media self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up FFmpeg and ffprobe
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6
        with:
          ffmpeg-version: 7.0.2

      - name: Verify FFmpeg and ffprobe
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders | grep -q libx264

      - name: Install CPU media dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run media regression self-test
        run: python selftest.py

  browser:
    name: Dashboard browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run real Chromium dashboard tests
        run: python -m pytest -q tests/test_dashboard_browser.py

  web:
    name: Web prototype tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Run web safety tests
        working-directory: web
        run: bun test
      - name: Build web prototype
        working-directory: web
        run: bun run build
