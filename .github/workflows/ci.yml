name: Elhadath Reels CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit and API tests
        run: python -m pytest -q --ignore=tests/test_dashboard_browser.py

      - name: Compile Python sources
        run: python -m compileall -q dashboard.py reel.py reelbot.py autopilot.py reelkit tests

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import subprocess
          import tempfile
          import dashboard

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', dashboard.HTML, re.S)
          assert scripts, 'dashboard JavaScript was not found'
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as handle:
              handle.write('\n'.join(scripts))
              path = handle.name
          try:
              result = subprocess.run(['node', '--check', path], text=True, capture_output=True)
              print(result.stderr)
              raise SystemExit(result.returncode)
          finally:
              Path(path).unlink(missing_ok=True)
          PY

  selftest:
    name: Media self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Install CPU media dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run media regression self-test
        run: python selftest.py

  browser:
    name: Dashboard browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run real Chromium dashboard tests
        run: python -m pytest -q tests/test_dashboard_browser.py
